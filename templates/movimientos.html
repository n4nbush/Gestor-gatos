<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resumen</title>
  <link rel="stylesheet" href="/static/styles.css">

</head>

<table>
    <thead>
        <tr>
            <th>Fecha</th>
            <th>Categoria</th>
            <th>Monto</th>
            <th>Ver mas</th>
        </tr>
    </thead>
<body>
  <main>
    
    
    <button onclick="window.location.href='/'">Cargar gasto</button>
    <button onclick="window.location.href='/resumen_cat'">Resumen por categorias</button>
    
    <div id="filtros_avanzados" class="oculto">
      <form class="form" method="post" style="display: inline;">
        <label for="miListaDesplegable">Selecciona un periodo:</label>
        <select name="filtro_fecha" id="filtro_fecha">
          <option value="30" selected>Seleccione un periodo</option>
          <option value="1">Dia</option>
          <option value="7">Semana</option>
          <option value="30">Mes</option>
          <option value="60">60 dias</option>
          <option value="360">Año</option>
        </select>
        <label for="miListaDesplegable">Selecciona un grupo:</label>
        <select name="grupo">
          {%for grupo in grupos%}
            <option value="{{grupo}}">{{grupo}}</option>
          {%endfor%}
            <option value="" selected>Seleccione un grupo</option>
        </select> 
        <label for="miListaDesplegable">Selecciona una categoria:</label>
        <select name="categoria">
            {% for categoria in categorias %}
              <option  value="{{categoria}}">{{categoria}}</option>
            {%endfor%}
            <option value="" selected>Seleccione una categoria</option>
          </select>
          <button type="submit" style="width: 20%;">Filtrar</button>
      </form>
    </div>
    <button onclick="toggleFiltros()" id="boton_filtros_avanzados">Filtros Avanzado▼</button>

    {% for resultado in resultados %}   
      <tr>
            <td>{{ resultado[1][:10] }}</td>
            <td>{{resultado[4]}}</td>
            <td>${{ (resultado[6]) }}</td>
            <td>
            <form action="/borrar" method="post">
              <input type="hidden" name="id" value="{{resultado[0]}}">
              <button type="submit">Ver más</button>
            </form>
            </td>
</td>
    </tr>
    {% endfor %}
    <tfoot>
      <tr>
        <td colspan="2">Total</td>
        <td>${{ total }}</td>
      </tr>
    </tfoot>
    <script src="{{ url_for('static', filename='main.js') }}"></script>

  </main>
</body>
</html>
